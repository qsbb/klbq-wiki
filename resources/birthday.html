<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:{{card_width}}px;background:#121214;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.card{border-radius:16px;overflow:hidden;background:#1a1a1e}
.masthead{padding:28px 28px 20px;border-bottom:1px solid #26262a}
.brand{font-size:10px;letter-spacing:5px;color:#555;font-weight:600;margin-bottom:10px}
.title{font-size:42px;font-weight:900;color:#e4e4e8;line-height:1.1}
.subtitle{color:#777;font-size:14px;margin-top:6px}
.hero{display:flex;align-items:center;gap:18px;margin:16px 28px;padding:16px;border-radius:12px;background:#1e1e22;border:1px solid rgba(255,200,120,.25)}
.hero-art{flex-shrink:0;width:180px;height:240px;object-fit:cover;object-position:center top;border-radius:10px;background:#141416}
.hero-info{flex:1;min-width:0}
.hero-name{font-size:36px;font-weight:900;color:#e4e4e8;line-height:1.1;margin-bottom:8px}
.hero-date{font-size:18px;font-weight:700;color:#c4a050;margin-bottom:6px}
.hero-countdown{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(255,200,120,.12);border:1px solid rgba(255,200,120,.3);color:#e8c05a;font-size:14px;font-weight:700}
.body{padding:0 28px 16px}
.list-title{font-size:14px;font-weight:700;color:#ccc;margin-bottom:8px;padding-left:10px;border-left:3px solid #4a9eff}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;background:#1e1e22;border:1px solid #26262a;margin-bottom:6px}
.row-name{color:#ddd;font-size:14px;font-weight:600}
.row-meta{color:#777;font-size:13px}
.row-countdown{color:#c4a050;font-size:13px;font-weight:600}
.footer{padding:0 28px 14px;text-align:right;color:#333;font-size:10px}
</style>
</head>
<body>
<div class="card">
  <div class="masthead"><div class="brand">KALABIYAU WIKI</div><div class="title">{{title}}</div><div class="subtitle">{{kind}}</div></div>
  {{if hero.art}}
  <div class="hero">
    <img class="hero-art" src="{{hero.art}}" />
    <div class="hero-info">
      <div class="hero-name">{{hero.name}}</div>
      <div class="hero-date">{{hero.date}}</div>
      <div class="hero-countdown">{{hero.countdown}}</div>
    </div>
  </div>
  {{/if}}
  {{if others.length}}
  <div class="body"><div class="list-title">其他近期生日</div>
    {{each others}}<div class="row"><span class="row-name">{{$value.name}}</span><span class="row-meta">{{$value.date}}</span><span class="row-countdown">{{$value.countdown}}</span></div>{{/each}}
  </div>
  {{/if}}
  <div class="footer">Generated by klbq-wiki for Yunzai</div>
</div>
</body>
</html>
