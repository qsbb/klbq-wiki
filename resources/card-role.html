<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:760px;background:var(--bg);font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#f2f0fa;overflow:hidden}
.card{width:760px;position:relative;background:var(--bg)}
.hero{position:relative;height:600px;overflow:hidden;
  background:linear-gradient(115deg,var(--heroA) 0%,var(--heroB) 45%,var(--heroC) 100%)}
.hero:before{content:"";position:absolute;right:-160px;top:-80px;width:560px;height:760px;
  background:linear-gradient(160deg,var(--acc1),var(--acc2));transform:skewX(-12deg);border-radius:40px}
.hero:after{content:"";position:absolute;right:-100px;top:-20px;width:420px;height:640px;
  background:radial-gradient(circle,var(--glow),transparent 60%);transform:skewX(-12deg)}
.hero img{position:absolute;z-index:2;filter:drop-shadow(-14px 18px 34px rgba(0,0,0,.55));
  height:590px;object-fit:contain;right:6px;bottom:0;
  transform:translate(calc((0.5 - var(--cx, 0.5)) * 100%), calc((0.5 - var(--cy, 0.5)) * 100%));
  transform-origin:center}
/* 横版立绘（宽高比>1.29）：改为右侧竖窗裁切 + 双向渐变羽化，避免压住标题 */
.hero img.wide{right:0;bottom:0;width:78%;height:100%;object-fit:cover;transform:none;
  -webkit-mask-image:linear-gradient(to right,rgba(0,0,0,0) 0%,#000 14%),linear-gradient(to bottom,rgba(0,0,0,0) 0%,#000 12%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.masthead{position:absolute;left:32px;top:34px;z-index:3}
.brand{font-size:13px;letter-spacing:5px;color:var(--brandTx);margin-bottom:12px}
.title{font-size:64px;font-weight:900;line-height:1.05;text-shadow:0 6px 22px rgba(0,0,0,.5)}
.en{margin-top:8px;font-size:19px;color:var(--sub);letter-spacing:1px}
.faction-tag{display:inline-block;margin-top:16px;font-size:15px;letter-spacing:2px;color:var(--brandTx);border:1px solid var(--line);border-radius:999px;padding:5px 16px}
.chips{position:absolute;left:32px;bottom:30px;z-index:3;display:flex;flex-direction:column;gap:8px}
.chips span{width:max-content;background:var(--chipBg);backdrop-filter:blur(5px);border-left:3px solid var(--accLine);padding:6px 14px;font-size:15px;border-radius:0 10px 10px 0}
.belt{position:relative;background:var(--beltBg);padding:20px 30px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 18px;border-top:1px solid var(--line)}
.kv .l{font-size:12px;color:var(--label);margin-bottom:3px;letter-spacing:1px}
.kv .v{font-size:16px;font-weight:700}
.long{grid-column:1/-1;font-size:14.5px;line-height:1.55;color:var(--longTx);padding:2px 0 8px;border-bottom:1px dashed var(--dash)}
.long b{color:var(--longLab);font-weight:600;margin-right:8px;font-size:12.5px}
.tip{margin:10px 30px 18px;font-size:13.5px;color:var(--tipTx);background:var(--tipBg);border:1px solid var(--tipLine);border-radius:10px;padding:9px 14px}
.tip:empty{display:none}

.foot{padding:0 30px 14px;font-size:11px;color:var(--footTx);text-align:right}
</style></head><body><div class="card"><div class="hero"><div class="masthead"><div class="brand">KALABIYAU WIKI</div><div class="title">{{title}}</div><div class="en" id="en"></div><div class="faction-tag" id="ft"></div></div><div class="chips" id="ch"></div><img src="{{thumb}}"></div><div class="belt" id="bt"></div><div class="tip">{{tip}}</div><div class="foot">Generated by klbq-wiki</div></div>
<script>const D={{DATA_JSON}};
const THEMES={
  '剪刀手':{bg:'#160f14',heroA:'#2a1220',heroB:'#1d0e17',heroC:'#120a0f',acc1:'#a8324f',acc2:'#6e1f33',glow:'rgba(255,120,150,.28)',brandTx:'#f0a5b8',sub:'#c48498',line:'rgba(255,135,163,.28)',chipBg:'rgba(24,10,15,.66)',accLine:'#ff87a3',beltBg:'#130c10',label:'#b07f8f',longTx:'#e5ccd4',longLab:'#ff9fb6',dash:'rgba(255,135,163,.18)',tipTx:'#ffd9c9',tipBg:'rgba(255,160,140,.07)',tipLine:'rgba(255,160,140,.22)',footTx:'rgba(200,155,170,.4)'},
  '乌尔比诺':{bg:'#171310',heroA:'#241a12',heroB:'#1b1410',heroC:'#120e0b',acc1:'#8a5f2a',acc2:'#5c3f1c',glow:'rgba(255,205,120,.28)',brandTx:'#e3bd77',sub:'#b3946a',line:'rgba(232,180,90,.3)',chipBg:'rgba(20,14,9,.66)',accLine:'#e8b45a',beltBg:'#141009',label:'#a68d64',longTx:'#ddd0ba',longLab:'#e8c684',dash:'rgba(232,180,90,.2)',tipTx:'#ffe6a8',tipBg:'rgba(232,180,90,.08)',tipLine:'rgba(232,180,90,.28)',footTx:'rgba(190,165,125,.4)'},
  '欧泊':{bg:'#101820',heroA:'#12232e',heroB:'#0e1a24',heroC:'#0b141c',acc1:'#1d5a6e',acc2:'#0f3a4a',glow:'rgba(90,200,220,.25)',brandTx:'#7fd0dc',sub:'#7ea8b5',line:'rgba(127,208,220,.28)',chipBg:'rgba(8,16,22,.62)',accLine:'#e8c05a',beltBg:'#0d151c',label:'#6f9aa6',longTx:'#cfdde2',longLab:'#8fd3de',dash:'rgba(127,208,220,.18)',tipTx:'#ffe79a',tipBg:'rgba(232,192,90,.07)',tipLine:'rgba(232,192,90,.25)',footTx:'rgba(160,190,200,.4)'},
};
const get=l=>(D.items.find(i=>i.label===l)||{}).value||'';
const item=l=>D.items.find(i=>i.label===l);
// 立绘中心点定位：按图片主体中心（或画布中心）对齐到模板固定位置
const heroImg=document.querySelector('.hero img');
if(D.bounds){
  heroImg.style.setProperty('--cx',D.bounds.cx);
  heroImg.style.setProperty('--cy',D.bounds.cy);
  // 横版图：右侧竖窗 + 以主体横向中心为焦点
  const ratio=(D.bounds.w&&D.bounds.h)?D.bounds.w/D.bounds.h:1;
  if(ratio>1.29){
    document.querySelector('.hero').classList.add('wide');
    heroImg.classList.add('wide');
    heroImg.style.objectPosition=(D.bounds.cx*100).toFixed(1)+'% 30%';
  }
}
const theme=THEMES[get('阵营')]||THEMES['欧泊'];
for(const[k,v]of Object.entries(theme))document.documentElement.style.setProperty('--'+k,v);
document.getElementById('en').textContent=[get('英文名'),get('日文名')].filter(Boolean).join(' / ');
document.getElementById('ft').textContent=get('阵营')||'';
if(!get('阵营'))document.getElementById('ft').style.display='none';
document.getElementById('ch').innerHTML=['定位','武器','武器类型'].map(l=>get(l)?`<span>${l} · ${get(l)}</span>`:'').join('');
const kvs=['性别','身份','生日','年龄','身高','体重','声优','活动区域'];
const longs=['超弦体特性','兴趣爱好','饮食习惯','个性语录','简介','观测语录'];
document.getElementById('bt').innerHTML=
  kvs.filter(l=>item(l)).map(l=>`<div class="kv"><div class="l">${l}</div><div class="v">${get(l)}</div></div>`).join('')+
  longs.filter(l=>item(l)).map(l=>`<div class="long"><b>${l}</b>${get(l)}</div>`).join('');
</script></body></html>
