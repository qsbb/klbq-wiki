<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#121214}
body{width:{{card_width}}px;background:#121214;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.card{border-radius:16px;overflow:hidden;background:#1a1a1e}
.masthead{padding:28px 28px 20px;border-bottom:1px solid #26262a}
.brand{font-size:10px;letter-spacing:5px;color:#555;font-weight:600;margin-bottom:10px}
.title{font-size:42px;font-weight:900;color:#e4e4e8;line-height:1.1}
.subtitle{color:#777;font-size:14px;margin-top:6px}
.cover-wrap{padding:20px 28px}
.cover{width:100%;height:380px;object-fit:contain;border-radius:12px;background:#141416}
.belt{display:flex;gap:12px;padding:16px 28px;border-top:1px solid #26262a;border-bottom:1px solid #26262a;background:#1e1e22}
.belt-item{flex:1;text-align:center}
.belt-label{font-size:10px;color:#666;letter-spacing:.5px;margin-bottom:2px}
.belt-value{font-size:18px;font-weight:800;color:#ccc}
.body{padding:20px 28px}
.kvgrid{display:grid;grid-template-columns:repeat({{grid_columns}},minmax(0,1fr));gap:8px}
.kv{padding:10px 12px;border-radius:8px;background:#1e1e22;border:1px solid #26262a}
.kv .l{color:#666;font-size:11px;margin-bottom:2px}
.kv .v{color:#ccc;font-size:14px;font-weight:600}
.long{grid-column:1/-1;padding:12px;border-radius:8px;background:#1e1e22;border:1px solid #26262a}
.long .l{color:#666;font-size:11px;margin-bottom:4px}
.long .v{color:#aaa;font-size:13px;line-height:1.55;font-weight:400}
.tip{margin:0 28px 16px;padding:8px 12px;border-radius:6px;background:#16161a;border:1px solid #26262a;color:#777;font-size:12px}
.tip:empty{display:none}
.footer{padding:0 28px 16px;text-align:right;color:#333;font-size:10px}
</style>
</head>
<body>
<div class="card">
  <div class="masthead"><div class="brand">KALABIYAU WIKI</div><div class="title">{{title}}</div><div class="subtitle">{{kind}}</div></div>
  {{if thumb}}<div class="cover-wrap"><img class="cover" src="{{thumb}}" /></div>{{/if}}
  <div class="body"><div class="kvgrid">
    {{each items}}
    <div class="kv"><div class="l">{{$value.label}}</div><div class="v">{{$value.value}}</div></div>
    {{/each}}
  </div></div>
  {{if tip}}<div class="tip">{{tip}}</div>{{/if}}
  <div class="footer">Generated by klbq-wiki</div>
</div>
</body>
</html>
