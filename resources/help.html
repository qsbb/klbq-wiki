<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#121214}
body{width:{{card_width}}px;background:#121214;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.card{border-radius:16px;overflow:hidden;background:#1a1a1e}
.masthead{padding:28px 28px 20px;border-bottom:1px solid #26262a}
.brand{font-size:10px;letter-spacing:5px;color:#555;font-weight:600;margin-bottom:10px}
.title{font-size:42px;font-weight:900;color:#e4e4e8;line-height:1.1}
.subtitle{color:#777;font-size:14px;margin-top:6px}
.body{padding:20px 28px}
.group{margin-bottom:16px}
.group-title{font-size:14px;font-weight:700;color:#ccc;margin-bottom:8px;padding-left:10px;border-left:3px solid #4a9eff}
.cmd{padding:8px 12px;border-radius:6px;background:#1e1e22;border:1px solid #26262a;margin-bottom:6px;display:flex;align-items:baseline;gap:10px}
.cmd-name{color:#ddd;font-size:14px;font-weight:600;flex-shrink:0}
.cmd-desc{color:#777;font-size:13px;line-height:1.4}
.cmd-value{color:#c4a050;font-size:12px;margin-left:auto;flex-shrink:0}
.footer{padding:0 28px 14px;text-align:right;color:#333;font-size:10px}
</style>
</head>
<body>
<div class="card">
  <div class="masthead"><div class="brand">KALABIYAU WIKI</div><div class="title">{{title}}</div><div class="subtitle">{{kind}}</div></div>
  <div class="body">{{each groups}}<div class="group"><div class="group-title">{{$value.name}}</div>{{each $value.items}}<div class="cmd"><span class="cmd-name">{{$value.name}}</span>{{if $value.desc}}<span class="cmd-desc">{{$value.desc}}</span>{{/if}}{{if $value.value}}<span class="cmd-value">{{$value.value}}</span>{{/if}}</div>{{/each}}</div>{{/each}}</div>
  <div class="footer">Generated by klbq-wiki for Yunzai</div>
</div>
</body>
</html>
