<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#10182f;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.card{width:100%;min-width:{{card_width}}px;padding:34px;color:#edf7ff;background:linear-gradient(135deg,#10182f,#17315a 50%,#563d92);position:relative;overflow:hidden}.glow{position:absolute;right:-100px;top:-110px;width:350px;height:350px;border-radius:50%;background:radial-gradient(circle,rgba(101,220,255,.45),transparent 68%)}.tag{display:inline-block;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#aee9ff;font-size:19px}.title{margin-top:12px;font-size:44px;font-weight:800}.subtitle{margin-top:7px;color:#c6d5ff;font-size:19px}.description{position:relative;margin:20px 0;padding:16px 18px;border-radius:15px;background:rgba(255,255,255,.09);font-size:18px;line-height:1.65;color:#dce8ff}.meta{position:relative;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.pill{padding:7px 12px;border-radius:10px;background:rgba(118,221,255,.16);border:1px solid rgba(118,221,255,.28);color:#b9edff;font-size:16px}.section{position:relative;margin-top:20px}.section-title{font-size:23px;font-weight:750;color:#aee9ff;margin-bottom:11px;padding-left:12px;border-left:4px solid #76ddff}.terrain{width:100%;max-height:680px;object-fit:contain;border-radius:17px;background:rgba(5,13,35,.38)}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gallery img{width:100%;height:220px;object-fit:cover;border-radius:14px;background:rgba(5,13,35,.38)}.footer{position:relative;margin-top:18px;text-align:right;color:rgba(237,247,255,.6);font-size:15px}
</style></head><body><div class="card"><div class="glow"></div><div class="tag">卡拉彼丘 Wiki</div><div class="title">{{title}}</div><div class="subtitle">{{kind}}</div>{{if description}}<div class="description">{{description}}</div>{{/if}}<div class="meta">{{each modes}}<span class="pill">{{$value}}</span>{{/each}}{{each platforms}}<span class="pill">{{$value}}</span>{{/each}}</div>{{if terrain.length}}<div class="section"><div class="section-title">地形图</div><img class="terrain" src="{{terrain[0]}}"></div>{{/if}}{{if gallery.length}}<div class="section"><div class="section-title">地图概览</div><div class="gallery">{{each gallery}}<img src="{{$value}}">{{/each}}</div></div>{{/if}}<div class="footer">数据来源：wiki.biligame.com/klbq · Generated by klbq-wiki</div></div></body></html>
