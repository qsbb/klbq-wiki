<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#121214}
body{width:{{card_width}}px;background:#121214;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.card{border-radius:16px;overflow:hidden;background:#1a1a1e}
.masthead{padding:28px 28px 20px;border-bottom:1px solid #26262a}
.brand{font-size:10px;letter-spacing:5px;color:#555;font-weight:600;margin-bottom:10px}
.title{font-size:42px;font-weight:900;color:#e4e4e8;line-height:1.1}
.subtitle{color:#777;font-size:14px;margin-top:6px}
.desc{margin:16px 28px;padding:12px 14px;border-radius:10px;background:#1e1e22;border:1px solid #26262a;font-size:13px;line-height:1.55;color:#aaa}
.meta{display:flex;gap:8px;flex-wrap:wrap;padding:0 28px 16px}
.pill{padding:4px 10px;border-radius:6px;background:rgba(74,158,255,.1);border:1px solid rgba(74,158,255,.2);color:#4a9eff;font-size:11px;font-weight:600}
.section{padding:0 28px 16px}
.section-title{font-size:14px;font-weight:700;color:#ccc;margin-bottom:8px;padding-left:10px;border-left:3px solid #4a9eff}
.terrain{width:100%;max-height:500px;object-fit:contain;border-radius:10px;background:#141416}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gallery img{width:100%;height:180px;object-fit:cover;border-radius:8px;background:#141416}
.footer{padding:0 28px 14px;text-align:right;color:#333;font-size:10px}
</style></head><body><div class="card">
<div class="masthead"><div class="brand">KALABIYAU WIKI</div><div class="title">{{title}}</div><div class="subtitle">{{kind}}</div></div>
{{if description}}<div class="desc">{{description}}</div>{{/if}}
<div class="meta">{{each modes}}<span class="pill">{{$value}}</span>{{/each}}{{each platforms}}<span class="pill">{{$value}}</span>{{/each}}</div>
{{if terrain.length}}<div class="section"><div class="section-title">地形图</div><img class="terrain" src="{{terrain[0]}}"></div>{{/if}}
{{if gallery.length}}<div class="section"><div class="section-title">地图概览</div><div class="gallery">{{each gallery}}<img src="{{$value}}">{{/each}}</div></div>{{/if}}
<div class="footer">数据来源：wiki.biligame.com/klbq · Generated by klbq-wiki</div>
</div></body></html>
