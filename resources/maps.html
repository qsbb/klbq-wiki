<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#10182f;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.card{width:100%;min-width:{{card_width}}px;padding:34px;color:#edf7ff;background:linear-gradient(135deg,#10182f,#17315a 50%,#563d92);position:relative;overflow:hidden}.glow{position:absolute;right:-100px;top:-110px;width:350px;height:350px;border-radius:50%;background:radial-gradient(circle,rgba(101,220,255,.45),transparent 68%)}.tag{position:relative;display:inline-block;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#aee9ff;font-size:19px}.title{position:relative;margin-top:12px;font-size:44px;font-weight:800}.subtitle{position:relative;margin-top:7px;color:#c6d5ff;font-size:19px}.mode{position:relative;margin-top:24px}.mode-title{font-size:25px;font-weight:750;color:#aee9ff;margin-bottom:12px;padding-left:12px;border-left:4px solid #76ddff}.grid{display:grid;grid-template-columns:repeat({{columns}},1fr);gap:13px}.map{overflow:hidden;border-radius:15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13)}.map img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:rgba(5,13,35,.38)}.empty{display:flex;width:100%;aspect-ratio:16/9;align-items:center;justify-content:center;color:#8abed5;font-size:18px;background:rgba(5,13,35,.38)}.name{padding:10px 8px 11px;text-align:center;color:#fff;font-size:18px;font-weight:650}.footer{position:relative;margin-top:20px;text-align:right;color:rgba(237,247,255,.6);font-size:15px}
</style></head><body><div class="card"><div class="glow"></div><div class="tag">卡拉彼丘 Wiki</div><div class="title">地图一览</div><div class="subtitle">按游戏模式查看地图，输入“-地图名”可查看地图详情</div>{{each groups}}<div class="mode"><div class="mode-title">{{$value.mode}}</div><div class="grid">{{each $value.maps}}<div class="map">{{if $value.image}}<img src="{{$value.image}}">{{else}}<div class="empty">暂无图片</div>{{/if}}<div class="name">{{$value.name}}</div></div>{{/each}}</div></div>{{/each}}<div class="footer">数据来源：wiki.biligame.com/klbq · Generated by klbq-wiki</div></div></body></html>
