<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:{{card_width}}px;background:#121214;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.card{border-radius:16px;overflow:hidden;background:#1a1a1e}
.masthead{padding:28px 28px 20px;border-bottom:1px solid #26262a}
.brand{font-size:10px;letter-spacing:5px;color:#555;font-weight:600;margin-bottom:10px}
.title{font-size:42px;font-weight:900;color:#e4e4e8;line-height:1.1}
.subtitle{color:#777;font-size:14px;margin-top:6px}
.body{padding:20px 28px}
.mode{margin-bottom:20px}
.mode-title{font-size:16px;font-weight:700;color:#ccc;margin-bottom:10px;padding-left:10px;border-left:3px solid #4a9eff}
.grid{display:grid;grid-template-columns:repeat({{columns}},1fr);gap:10px}
.map{overflow:hidden;border-radius:10px;background:#1e1e22;border:1px solid #26262a}
.map img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#141416}
.empty{display:flex;width:100%;aspect-ratio:16/9;align-items:center;justify-content:center;color:#555;font-size:13px;background:#141416}
.name{padding:8px;text-align:center;color:#ccc;font-size:13px;font-weight:600}
.footer{padding:0 28px 14px;text-align:right;color:#333;font-size:10px}
</style></head><body><div class="card">
<div class="masthead"><div class="brand">KALABIYAU WIKI</div><div class="title">地图一览</div><div class="subtitle">按游戏模式查看地图，输入"-地图名"可查看地图详情</div></div>
<div class="body">{{each groups}}<div class="mode"><div class="mode-title">{{$value.mode}}</div><div class="grid">{{each $value.maps}}<div class="map">{{if $value.image}}<img src="{{$value.image}}">{{else}}<div class="empty">暂无图片</div>{{/if}}<div class="name">{{$value.name}}</div></div>{{/each}}</div></div>{{/each}}</div>
<div class="footer">数据来源：wiki.biligame.com/klbq · Generated by klbq-wiki</div>
</div></body></html>
