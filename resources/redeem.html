<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; min-width: 0; min-height: 0; background: #10182f; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; overflow: hidden; }
.klbq-card { width: 100%; min-width: {{card_width}}px; position: relative; overflow: hidden; padding: 34px; color: #edf7ff; background: linear-gradient(135deg, #10182f 0%, #182a55 48%, #5d3ca0 100%); }
.glow { position: absolute; right: -100px; top: -120px; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(118, 221, 255, .48), rgba(118, 221, 255, 0) 68%); }
.glow2 { position: absolute; left: -80px; bottom: -100px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 204, 112, .32), rgba(255, 204, 112, 0) 70%); }
.header { position: relative; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
.tag { display: inline-block; padding: 7px 14px; border-radius: 999px; background: rgba(255, 255, 255, .14); color: #aee9ff; font-size: 20px; letter-spacing: 1px; }
.title { margin-top: 12px; font-size: 42px; font-weight: 800; text-shadow: 0 4px 16px rgba(0, 0, 0, .28); }
.subtitle { margin-top: 8px; color: #c6d5ff; font-size: 20px; }
.updated { color: rgba(237, 247, 255, .62); font-size: 16px; text-align: right; }
.code-list { position: relative; display: grid; grid-template-columns: 1fr; gap: 14px; }
.code-card { padding: 18px 20px; border-radius: 18px; background: rgba(255, 255, 255, .10); border: 1px solid rgba(255, 255, 255, .13); box-shadow: 0 8px 24px rgba(0, 0, 0, .12); }
.code-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.code { color: #fff2a8; font-family: Consolas, "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 800; letter-spacing: 1px; word-break: break-all; }
.section { flex-shrink: 0; padding: 5px 10px; border-radius: 999px; color: #aee9ff; background: rgba(118, 221, 255, .14); border: 1px solid rgba(118, 221, 255, .25); font-size: 15px; }
.reward { margin-top: 12px; color: #ffffff; font-size: 20px; line-height: 1.5; }
.meta { margin-top: 8px; color: #c6d5ff; font-size: 17px; }
.notice { position: relative; margin-top: 18px; padding: 13px 16px; border-radius: 12px; color: #ffe9bd; background: rgba(255, 196, 96, .12); border: 1px solid rgba(255, 196, 96, .23); font-size: 16px; line-height: 1.5; }
.footer { position: relative; margin-top: 18px; color: rgba(237, 247, 255, .62); font-size: 15px; text-align: right; }
</style>
</head>
<body>
<div id="container" class="klbq-card">
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="header">
    <div>
      <div class="tag">卡拉彼丘 Wiki</div>
      <div class="title">{{title}}</div>
      <div class="subtitle">{{kind}}</div>
    </div>
    <div class="updated">更新时间：{{updated}}</div>
  </div>
  <div class="code-list">
    {{each codes}}
    <div class="code-card">
      <div class="code-head">
        <div class="code">{{$value.code}}</div>
        {{if $value.section}}<div class="section">{{$value.section}}</div>{{/if}}
      </div>
      <div class="reward">奖励：{{$value.reward}}</div>
      <div class="meta">有效期：{{$value.expires}}</div>
    </div>
    {{/each}}
  </div>
  <div class="notice">标注“未知”的兑换码可能随时失效，请尽快在游戏内使用；最终可用状态以游戏提示为准。</div>
  <div class="footer">数据来源：wiki.biligame.com/klbq · Generated by klbq-wiki</div>
</div>
</body>
</html>
