<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:{{card_width}}px;background:#121214;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.card{border-radius:16px;overflow:hidden;background:#1a1a1e}
.masthead{padding:28px 28px 20px;border-bottom:1px solid #26262a;display:flex;justify-content:space-between;align-items:flex-end}
.masthead-left .brand{font-size:10px;letter-spacing:5px;color:#555;font-weight:600;margin-bottom:10px}
.masthead-left .title{font-size:42px;font-weight:900;color:#e4e4e8;line-height:1.1}
.masthead-left .subtitle{color:#777;font-size:14px;margin-top:6px}
.updated{color:#444;font-size:11px;text-align:right;flex-shrink:0}
.body{padding:20px 28px}
.code-card{padding:14px;border-radius:10px;background:#1e1e22;border:1px solid #26262a;margin-bottom:8px}
.code-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.code{color:#e8c05a;font-family:Consolas,Menlo,monospace;font-size:20px;font-weight:800;letter-spacing:1px;word-break:break-all}
.section{flex-shrink:0;padding:2px 8px;border-radius:4px;color:#4a9eff;background:rgba(74,158,255,.1);font-size:10px;font-weight:700}
.reward{margin-top:8px;color:#ddd;font-size:14px;line-height:1.5}
.meta{margin-top:4px;color:#777;font-size:12px}
.notice{margin:0 28px 16px;padding:10px 12px;border-radius:8px;color:#888;background:#16161a;border:1px solid #26262a;font-size:11px;line-height:1.5}
.footer{padding:0 28px 14px;text-align:right;color:#333;font-size:10px}
</style>
</head>
<body>
<div class="card">
  <div class="masthead"><div class="masthead-left"><div class="brand">KALABIYAU WIKI</div><div class="title">{{title}}</div><div class="subtitle">{{kind}}</div></div><div class="updated">更新：{{updated}}</div></div>
  <div class="body">{{each codes}}<div class="code-card"><div class="code-head"><div class="code">{{$value.code}}</div>{{if $value.section}}<div class="section">{{$value.section}}</div>{{/if}}</div><div class="reward">奖励：{{$value.reward}}</div><div class="meta">有效期：{{$value.expires}}</div></div>{{/each}}</div>
  <div class="notice">标注"未知"的兑换码可能随时失效，请尽快在游戏内使用；最终可用状态以游戏提示为准。</div>
  <div class="footer">数据来源：wiki.biligame.com/klbq · Generated by klbq-wiki</div>
</div>
</body>
</html>
