<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:{{card_width}}px;background:#121214;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.card{border-radius:16px;overflow:hidden;background:#1a1a1e}
.masthead{padding:28px 28px 20px;border-bottom:1px solid #26262a}
.brand{font-size:10px;letter-spacing:5px;color:#555;font-weight:600;margin-bottom:10px}
.title{font-size:42px;font-weight:900;color:#e4e4e8;line-height:1.1}
.subtitle{color:#777;font-size:14px;margin-top:6px}
.body{padding:20px 28px}
.skill{display:flex;gap:12px;padding:12px;border-radius:10px;background:#1e1e22;border:1px solid #26262a;margin-bottom:8px}
.icon{width:64px;height:64px;border-radius:8px;background:#16161a;border:1px solid #26262a;display:flex;align-items:center;justify-content:center;color:#555;font-size:20px;flex-shrink:0;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:contain}
.sbody{flex:1}
.shead{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.stype{padding:1px 6px;border-radius:4px;background:rgba(74,158,255,.1);color:#4a9eff;font-size:10px;font-weight:700}
.sname{font-size:16px;font-weight:700;color:#ddd}
.sdesc{font-size:13px;line-height:1.5;color:#888}
.footer{padding:0 28px 14px;text-align:right;color:#333;font-size:10px}
</style></head><body><div class="card">
<div class="masthead"><div class="brand">KALABIYAU WIKI</div><div class="title">{{title}}</div><div class="subtitle">{{kind}}</div></div>
<div class="body">{{each skills}}<div class="skill"><div class="icon">{{if $value.icon}}<img src="{{$value.icon}}">{{else}}技{{/if}}</div><div class="sbody"><div class="shead"><span class="stype">{{$value.type}}</span><span class="sname">{{$value.name}}</span></div><div class="sdesc">{{$value.description}}</div></div></div>{{/each}}</div>
<div class="footer">数据来源：wiki.biligame.com/klbq · Generated by klbq-wiki</div>
</div></body></html>
