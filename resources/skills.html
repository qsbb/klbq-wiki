<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#10182f;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.card{width:100%;min-width:{{card_width}}px;padding:34px;color:#edf7ff;background:linear-gradient(135deg,#10182f,#18305d 52%,#573d91);position:relative;overflow:hidden}.glow{position:absolute;right:-100px;top:-110px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(96,222,255,.45),transparent 68%)}.tag{display:inline-block;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#aee9ff;font-size:19px}.title{margin-top:12px;font-size:42px;font-weight:800}.subtitle{margin:7px 0 22px;color:#c6d5ff;font-size:19px}.list{display:grid;gap:14px;position:relative}.skill{display:grid;grid-template-columns:86px 1fr;gap:17px;padding:17px;border:1px solid rgba(255,255,255,.13);border-radius:18px;background:rgba(255,255,255,.1)}.icon{width:86px;height:86px;border-radius:16px;object-fit:contain;background:rgba(5,13,35,.36);padding:6px}.icon-empty{display:flex;align-items:center;justify-content:center;color:#aee9ff;font-size:32px}.head{display:flex;align-items:center;gap:12px;margin-bottom:9px}.type{padding:4px 9px;border-radius:8px;background:rgba(118,221,255,.18);border:1px solid rgba(118,221,255,.3);color:#aee9ff;font-size:15px}.name{font-size:24px;font-weight:750;color:#fff}.desc{font-size:18px;line-height:1.65;color:#d6e2ff}.footer{margin-top:18px;text-align:right;color:rgba(237,247,255,.6);font-size:15px}
</style></head><body><div class="card"><div class="glow"></div><div class="tag">卡拉彼丘 Wiki</div><div class="title">{{title}}</div><div class="subtitle">{{kind}}</div><div class="list">{{each skills}}<div class="skill">{{if $value.icon}}<img class="icon" src="{{$value.icon}}">{{else}}<div class="icon icon-empty">技</div>{{/if}}<div><div class="head"><span class="type">{{$value.type}}</span><span class="name">{{$value.name}}</span></div><div class="desc">{{$value.description}}</div></div></div>{{/each}}</div><div class="footer">数据来源：wiki.biligame.com/klbq · Generated by klbq-wiki</div></div></body></html>
