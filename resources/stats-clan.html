<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#121214}
body{width:{{card_width}}px;background:#121214;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.card{border-radius:16px;overflow:hidden;background:#1a1a1e}
.masthead{padding:26px 28px 18px;border-bottom:1px solid #26262a;position:relative}
.masthead::after{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:#28b3a4}
.brand{font-size:10px;letter-spacing:5px;color:#555;font-weight:600;margin-bottom:10px}
.title{font-size:32px;font-weight:900;color:#e4e4e8;line-height:1.15;word-break:break-all}
.subtitle{color:#888;font-size:13px;margin-top:6px}
.body{padding:18px 28px}
.clan{padding:14px 0;border-bottom:1px solid #1f1f23}
.clan:last-child{border-bottom:0}
.clan-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.clan-name{font-size:17px;font-weight:800;color:#e4e4e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clan-id{font-size:11px;color:#5a5a5f;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats{display:flex;gap:22px;margin-top:8px}
.stat{display:flex;align-items:baseline;gap:5px}
.stat .l{font-size:10px;color:#666}
.stat .v{font-size:15px;font-weight:800;color:#28b3a4;font-variant-numeric:tabular-nums}
.intro{margin-top:8px;font-size:12px;color:#888;line-height:1.55}
.tip{margin:12px 28px 16px;padding:8px 12px;border-radius:6px;background:#16161a;border:1px solid #26262a;color:#777;font-size:12px;line-height:1.5}
.tip:empty{display:none}
.footer{padding:0 28px 16px;text-align:right;color:#333;font-size:10px}
.empty{padding:28px 0;text-align:center;color:#555;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <div class="masthead">
    <div class="brand">KALABIYAU CLAN</div>
    <div class="title">{{title}}</div>
    {{if kind}}<div class="subtitle">{{kind}}</div>{{/if}}
  </div>
  <div class="body">
    {{if rows.length}}
    {{each rows}}
    <div class="clan">
      <div class="clan-head">
        <span class="clan-name">{{$value.name}}</span>
        <span class="clan-id">ID {{$value.id}}</span>
      </div>
      <div class="stats">
        <div class="stat"><span class="l">等级</span><span class="v">{{$value.level}}</span></div>
        <div class="stat"><span class="l">成员</span><span class="v">{{$value.members}}</span></div>
      </div>
      {{if $value.intro}}<div class="intro">{{$value.intro}}</div>{{/if}}
    </div>
    {{/each}}
    {{else}}
    <div class="empty">{{emptyText}}</div>
    {{/if}}
  </div>
  {{if tip}}<div class="tip">{{tip}}</div>{{/if}}
  <div class="footer">Generated by klbq-wiki</div>
</div>
</body>
</html>
