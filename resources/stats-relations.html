<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#121214}
body{width:{{card_width}}px;background:#121214;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.card{border-radius:16px;overflow:hidden;background:#1a1a1e}
.masthead{padding:26px 28px 18px;border-bottom:1px solid #26262a;position:relative}
.masthead::after{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:{{accent}}}
.brand{font-size:10px;letter-spacing:5px;color:#555;font-weight:600;margin-bottom:10px}
.title{font-size:32px;font-weight:900;color:#e4e4e8;line-height:1.15;word-break:break-all}
.subtitle{color:#888;font-size:13px;margin-top:6px}
.body{padding:12px 28px 6px}
table{width:100%;border-collapse:collapse}
th{font-size:10px;color:#5a5a5f;font-weight:600;text-align:left;padding:6px 0 8px;border-bottom:1px solid #26262a;letter-spacing:.5px}
td{font-size:13px;color:#bbb;padding:8px 0;border-bottom:1px solid #1f1f23}
tr:last-child td{border-bottom:0}
td.pos{width:30px;color:#555;font-variant-numeric:tabular-nums;font-size:11px}
td.name{color:#ddd;font-weight:600;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
td.rate{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
td.rate.up{color:#4ade80}
td.rate.down{color:#f87171}
.last{display:block;color:#555;font-size:10px;font-weight:400;margin-top:2px}
.empty{padding:30px 0;text-align:center;color:#555;font-size:13px}
.tip{margin:10px 28px 16px;padding:8px 12px;border-radius:6px;background:#16161a;border:1px solid #26262a;color:#777;font-size:12px;line-height:1.5}
.tip:empty{display:none}
.footer{padding:0 28px 16px;text-align:right;color:#333;font-size:10px}
</style>
</head>
<body>
<div class="card">
  <div class="masthead">
    <div class="brand">KALABIYAU STATS</div>
    <div class="title">{{title}}</div>
    <div class="subtitle">{{kind}}</div>
  </div>
  <div class="body">
    {{if rows.length}}
    <table>
      <tr><th>#</th><th>玩家</th><th class="num">场次</th><th class="num">胜/负</th><th class="num">胜率</th></tr>
      {{each rows}}
      <tr>
        <td class="pos">{{$index + 1}}</td>
        <td class="name">{{$value.name}}<span class="last">最近 {{$value.last}}</span></td>
        <td class="num">{{$value.games}}</td>
        <td class="num">{{$value.wins}}/{{$value.losses}}</td>
        <td class="rate {{$value.rateClass}}">{{$value.winRate}}</td>
      </tr>
      {{/each}}
    </table>
    {{else}}
    <div class="empty">{{emptyText}}</div>
    {{/if}}
  </div>
  {{if tip}}<div class="tip">{{tip}}</div>{{/if}}
  <div class="footer">Generated by klbq-wiki</div>
</div>
</body>
</html>
